name: Create Release Proposal

on:
  workflow_dispatch:
    inputs:
      release-line:
        required: true
        type: number
        description: 'The release line (without dots or prefix). e.g: 22'
        default: 22
      release-date:
        required: true
        type: string
        description: 'The release date in YYYY-MM-DD format'
        default: '2026-11-02'
      mode:
        description: 'Execution mode: auto (default), native (uses GITHUB_TOKEN & artifacts), original (strict GH_USER_TOKEN)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - native
          - original
      dry_run:
        description: 'Simulate release proposal locally without creating remote branches or PRs'
        required: false
        default: true
        type: boolean

concurrency: ${{ github.workflow }}

env:
  NODE_VERSION: lts/*

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  releasePrepare:
    name: Prepare Release Proposal
    env:
      STAGING_BRANCH: v${{ inputs.release-line }}.x-staging
      RELEASE_BRANCH: v${{ inputs.release-line }}.x
      RELEASE_DATE: ${{ inputs.release-date || '2026-11-02' }}
      RELEASE_LINE: ${{ inputs.release-line || 22 }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.STAGING_BRANCH }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install @node-core/utils
        run: npm install -g @node-core/utils

      - name: Configure @node-core/utils
        run: |
          ncu-config set branch "${RELEASE_BRANCH}"
          ncu-config set upstream origin
          ncu-config set username "${GITHUB_ACTOR}"
          ncu-config set token "$GH_TOKEN"
          ncu-config set repo "$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          ncu-config set owner "${GITHUB_REPOSITORY_OWNER}"
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up ghauth config (Ubuntu)
        run: |
          mkdir -p "${XDG_CONFIG_HOME:-~/.config}/changelog-maker"
          jq --null-input '{user: env.GITHUB_ACTOR, token: env.TOKEN}' > "${XDG_CONFIG_HOME:-~/.config}/changelog-maker/config.json"
        env:
          TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup git author
        run: |
          git config --local user.email "github-bot@iojs.org"
          git config --local user.name "Node.js GitHub Bot"

      - name: Start git node release prepare
        run: |
          mkdir -p reports
          if [ -f "tools/actions/create-release-proposal.sh" ]; then
            SCRIPT="tools/actions/create-release-proposal.sh"
          else
            curl -fsSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tools/actions/create-release-proposal.sh" -o /tmp/create-release-proposal.sh
            SCRIPT="/tmp/create-release-proposal.sh"
          fi
          sh "$SCRIPT" "${RELEASE_DATE}" "${RELEASE_LINE}" "${GITHUB_ACTOR}"
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Upload Release Proposal Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: release-proposal-report
          path: reports/
          if-no-files-found: ignore
